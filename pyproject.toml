[project]
name = "paperlens"
version = "0.1.0"
description = "论文检索与分析 Agent：arXiv 论文知识库 + 混合检索 RAG + LangGraph 编排"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "lxml==6.1.3",
    "milvus-lite==3.2.1",
    "openai==3.22.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pymilvus==3.0.2",
    "pymupdf4llm==1.28.2",
    "python-multipart==0.0.32",
    "rich==15.0.0",
    "sse-starlette==3.5.0",
    "streamlit==1.65.0",
    "tenacity==9.1.4",
    "typer==0.27.2",
    "uvicorn==0.54.0",
]

[project.scripts]
paperlens = "paperlens.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 行长度交给 ruff format 处理；中文按双倍宽度计算，含中文的字符串无法自动折行
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer / FastAPI 的标准写法是在参数默认值里调用 typer.Option、fastapi.File 等
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.File", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
