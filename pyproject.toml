[project]
name = "paperlens"
version = "0.1.0"
description = "论文检索与分析 Agent：arXiv 论文知识库 + 混合检索 RAG + LangGraph 编排"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "openai==3.22.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "rich==15.0.0",
    "tenacity==9.1.4",
    "typer==0.27.2",
]

[project.scripts]
paperlens = "paperlens.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 行长度交给 ruff format 处理；中文按双倍宽度计算，含中文的字符串无法自动折行
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
