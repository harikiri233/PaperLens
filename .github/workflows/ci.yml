name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 安装依赖
        run: uv sync --locked
      - name: 代码检查
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: 单元测试
        run: uv run pytest -q
